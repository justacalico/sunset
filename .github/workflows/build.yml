name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_all:
        description: 'Build all release targets'
        type: boolean
        default: true
      create_release:
        description: 'Create a versioned release from this build'
        type: boolean
        default: false
      merge_request_id:
        description: 'Merge request ID'
        type: string
        default: ''
      merge_request_url:
        description: 'Merge request URL'
        type: string
        default: ''

permissions:
  contents: write
  actions: read

env:
  FLUTTER_VERSION: "3.47.7"
  COCOGITTO_VERSION: "7.0.0"
  APP_ID: "gitlab.httpanimations.sunset"

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  setup:
    name: Setup build metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build_number: ${{ steps.meta.outputs.build_number }}
      build_all: ${{ steps.meta.outputs.build_all }}
      targets: ${{ steps.meta.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read version and build metadata
        id: meta
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | sed 's/^version: //; s/+.*//')
          BUILD_NUMBER=$(grep '^version: ' pubspec.yaml | sed 's/.*+//')
          if [ -n "${{ inputs.build_all }}" ]; then
            BUILD_ALL="${{ inputs.build_all }}"
          else
            BUILD_ALL="true"
          fi
          if [ "$BUILD_ALL" = "true" ]; then
            TARGETS='[{"target":"linux","os":"ubuntu-latest","arch":"x86_64"},{"target":"linux-arm64","os":"ubuntu-24.04-arm","arch":"aarch64"},{"target":"android","os":"ubuntu-latest"},{"target":"windows","os":"windows-latest"},{"target":"macos","os":"macos-latest"},{"target":"ios","os":"macos-latest"},{"target":"web","os":"ubuntu-latest"}]'
          else
            TARGETS='[]'
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "build_all=$BUILD_ALL" >> "$GITHUB_OUTPUT"
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install cocogitto
        run: |
          curl -fsSL --retry 3 -o /tmp/cog.tar.gz "https://github.com/cocogitto/cocogitto/releases/download/${COCOGITTO_VERSION}/cocogitto-${COCOGITTO_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          mkdir -p /tmp/cog && tar -xzf /tmp/cog.tar.gz -C /tmp/cog
          sudo install -m 755 /tmp/cog/x86_64-unknown-linux-musl/cog /usr/local/bin/cog

      - name: Check commits
        if: github.event_name != 'pull_request'
        run: cog check

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test

      - name: Landing pub get
        run: cd landing && flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test with coverage
        run: flutter test --coverage

      - name: Require 100% line coverage
        run: |
          python3 - <<'PY'
          lf = lh = 0
          cur = ''
          missed = []
          for line in open('coverage/lcov.info'):
              line = line.strip()
              if line.startswith('SF:'):
                  cur = line[3:]
              elif line.startswith('LF:'):
                  lf += int(line[3:])
              elif line.startswith('LH:'):
                  lh += int(line[3:])
              elif line.startswith('DA:') and line.endswith(',0'):
                  missed.append(f'{cur}:{line[3:]}')
          if lf == 0 or lh != lf:
              print('\n'.join(missed))
              raise SystemExit(f'coverage {lh}/{lf}, need 100%')
          print(f'coverage {lh}/{lf} OK')
          PY

      - name: Landing analyze and test
        run: |
          cd landing
          flutter analyze --no-fatal-infos
          flutter test

  build:
    name: Build ${{ matrix.target }}
    needs: [setup, verify]
    if: ${{ needs.setup.outputs.build_all == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.targets) }}
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.setup.outputs.version }}
      BUILD_NUMBER: ${{ needs.setup.outputs.build_number }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        if: matrix.target != 'linux-arm64'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Flutter arm64
        if: matrix.target == 'linux-arm64'
        run: |
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git /opt/flutter
          echo "/opt/flutter/bin" >> "$GITHUB_PATH"
          export PATH="/opt/flutter/bin:$PATH"
          git config --global --add safe.directory /opt/flutter
          flutter --version

      - name: Install Linux dependencies
        if: startsWith(matrix.target, 'linux')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev dpkg-dev rpm flatpak flatpak-builder curl unzip zip gpg

      - name: Pub get
        run: flutter pub get

      - name: Prepare Android signing
        id: signing
        if: matrix.target == 'android'
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Missing keystore on a release build, refusing to ship debug-signed artifacts" >&2
            exit 1
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/android/sunset.jks" || exit 1
          cat > "$GITHUB_WORKSPACE/android/key.properties" <<EOF
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=sunset.jks
          EOF
          keytool -list -keystore "$GITHUB_WORKSPACE/android/sunset.jks" -storepass "${{ secrets.ANDROID_STORE_PASSWORD }}" >/dev/null || exit 1

      - name: Import flatpak signing key
        if: startsWith(matrix.target, 'linux')
        run: |
          mkdir -p .gpg
          echo "${{ secrets.FLATPAK_GPG_KEY }}" | base64 -d | gpg --batch --homedir .gpg --import
          KEYID=$(gpg --batch --homedir .gpg --with-colons --list-keys | awk -F: '/^pub/ {print $5; exit}')
          echo "FLATPAK_KEYID=$KEYID" >> "$GITHUB_ENV"
          chmod -R 700 .gpg

      - name: Build Linux
        if: startsWith(matrix.target, 'linux')
        run: |
          flutter build linux --release --build-name="$VERSION" --build-number="$BUILD_NUMBER"
          LINUX_ARCH="${{ matrix.arch }}"
          FLUTTER_ARCH=$([ "$LINUX_ARCH" = "aarch64" ] && echo arm64 || echo x64)
          BUNDLE="build/linux/${FLUTTER_ARCH}/release/bundle"
          mkdir -p artifacts

          tar -czf "artifacts/sunset-${VERSION}-linux-${LINUX_ARCH}.tar.gz" -C "$BUNDLE" .
          (cd "$BUNDLE" && zip -qr "../../../../../artifacts/sunset-${VERSION}-linux-${LINUX_ARCH}.zip" .)

          # .deb
          PKGDIR=$(mktemp -d)
          mkdir -p "$PKGDIR/opt/sunset" "$PKGDIR/usr/bin" "$PKGDIR/DEBIAN" \
            "$PKGDIR/usr/share/applications" "$PKGDIR/usr/share/icons/hicolor/256x256/apps"
          cp -a "$BUNDLE/." "$PKGDIR/opt/sunset/"
          ln -sf /opt/sunset/sunset "$PKGDIR/usr/bin/sunset"
          install -m644 packaging/linux/sunset.desktop "$PKGDIR/usr/share/applications/${{ env.APP_ID }}.desktop"
          install -m644 packaging/linux/sunset.png "$PKGDIR/usr/share/icons/hicolor/256x256/apps/${{ env.APP_ID }}.png"
          install -m644 packaging/linux/sunset.png "$PKGDIR/usr/share/icons/hicolor/256x256/apps/sunset.png"
          DEB_ARCH=$([ "$LINUX_ARCH" = "aarch64" ] && echo arm64 || echo amd64)
          cat > "$PKGDIR/DEBIAN/control" <<EOF
          Package: sunset
          Version: ${VERSION}
          Architecture: ${DEB_ARCH}
          Maintainer: Sunset CI <ci@gitlab.com>
          Section: devel
          Priority: optional
          Description: A visual Flutter app builder
          EOF
          dpkg-deb --build "$PKGDIR" "artifacts/sunset-${VERSION}-linux-${LINUX_ARCH}.deb"

          # .rpm
          bash scripts/build-rpm.sh "$BUNDLE" "$VERSION" "$LINUX_ARCH" "artifacts/sunset-${VERSION}-linux-${LINUX_ARCH}.rpm" "$BUILD_NUMBER"

          # AppImage
          APPIMAGE_TOOL_ARCH=$([ "$LINUX_ARCH" = "aarch64" ] && echo aarch64 || echo x86_64)
          curl -fsSL -o /tmp/appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${APPIMAGE_TOOL_ARCH}.AppImage"
          chmod +x /tmp/appimagetool
          APPDIR=$(mktemp -d)
          mkdir -p "$APPDIR/usr/lib/sunset" "$APPDIR/usr/share/applications" "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp -a "$BUNDLE/." "$APPDIR/usr/lib/sunset/"
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/usr/lib/sunset/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          exec "$HERE/usr/lib/sunset/sunset" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"
          install -m644 packaging/linux/sunset.desktop "$APPDIR/${{ env.APP_ID }}.desktop"
          sed -i 's|Exec=sunset|Exec=usr/lib/sunset/sunset|' "$APPDIR/${{ env.APP_ID }}.desktop"
          install -m644 packaging/linux/sunset.png "$APPDIR/${{ env.APP_ID }}.png"
          install -m644 packaging/linux/sunset.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/${{ env.APP_ID }}.png"
          install -m644 packaging/linux/sunset.desktop "$APPDIR/usr/share/applications/${{ env.APP_ID }}.desktop"
          ARCH=$APPIMAGE_TOOL_ARCH /tmp/appimagetool --appimage-extract-and-run "$APPDIR" "artifacts/sunset-${VERSION}-linux-${LINUX_ARCH}.AppImage" || \
          ARCH=$APPIMAGE_TOOL_ARCH /tmp/appimagetool "$APPDIR" "artifacts/sunset-${VERSION}-linux-${LINUX_ARCH}.AppImage"

          # Flatpak (both arches), signed with the project key
          mkdir -p bundle
          cp -a "$BUNDLE/." bundle/
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo || flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08 || true
          sudo flatpak-builder --force-clean --repo=flatpak-repo build-dir packaging/flatpak/gitlab.httpanimations.sunset.yml || flatpak-builder --force-clean --repo=flatpak-repo --user build-dir packaging/flatpak/gitlab.httpanimations.sunset.yml
          sudo chown -R "$(id -u):$(id -g)" flatpak-repo
          flatpak build-update-repo --gpg-sign="$FLATPAK_KEYID" --gpg-homedir="$(pwd)/.gpg" flatpak-repo
          tar -czf "artifacts/sunset-${VERSION}-flatpak-${LINUX_ARCH}.tar.gz" -C flatpak-repo .
          rm -rf bundle
          sudo rm -rf build-dir .flatpak-builder
          ls -la artifacts/

      - name: Build Android
        if: matrix.target == 'android'
        run: |
          flutter build apk --release --build-name="$VERSION" --build-number="$BUILD_NUMBER"
          flutter build appbundle --release --build-name="$VERSION" --build-number="$BUILD_NUMBER"
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk "artifacts/sunset-${VERSION}-android.apk"
          cp build/app/outputs/bundle/release/app-release.aab "artifacts/sunset-${VERSION}-android.aab"
          ls -la artifacts/

      - name: Build Windows
        if: matrix.target == 'windows'
        run: |
          flutter build windows --release --build-name="$VERSION" --build-number="$BUILD_NUMBER"
          mkdir -p artifacts
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "artifacts/sunset-$env:VERSION-windows-x86_64.zip"
          ls artifacts/

      - name: Build macOS
        if: matrix.target == 'macos'
        run: |
          flutter build macos --release --build-name="$VERSION" --build-number="$BUILD_NUMBER"
          mkdir -p artifacts
          cd build/macos/Build/Products/Release
          zip -qr "../../../../../artifacts/sunset-${VERSION}-macos-arm64.zip" .
          ls -la ../../../../../artifacts/

      - name: Build iOS
        if: matrix.target == 'ios'
        run: |
          flutter build ios --release --no-codesign --build-name="$VERSION" --build-number="$BUILD_NUMBER"
          mkdir -p artifacts Payload
          cp -r "build/ios/iphoneos/Runner.app" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload "artifacts/sunset-${VERSION}-ios.ipa"
          ls -la artifacts/

      - name: Build web
        if: matrix.target == 'web'
        run: |
          flutter build web --release --build-name="$VERSION" --build-number="$BUILD_NUMBER"
          mkdir -p artifacts
          (cd build/web && zip -qr "../../artifacts/sunset-${VERSION}-web.zip" .)
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: artifacts/
          retention-days: 400

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [setup, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.setup.outputs.build_all == 'true' && inputs.merge_request_id == '' && ((github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && (inputs.create_release == true || inputs.create_release == 'true')) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) }}
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
    concurrency:
      group: release-ops
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine release tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "release_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=v${{ needs.setup.outputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag for dispatch releases
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.meta.outputs.release_tag }}"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag -f "$TAG"
          git push -f origin "refs/tags/$TAG"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: artifacts
          merge-multiple: true

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f -name 'sunset*' -exec cp {} release-assets/ \;
          TAG="${{ steps.meta.outputs.release_tag }}"
          git archive --format=tar.gz -o "release-assets/sunset-${TAG}-source.tar.gz" "$TAG" || true
          ls -la release-assets/

      - name: Checksums
        run: |
          cd release-assets
          sha256sum * | tee ../SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: Sunset ${{ steps.meta.outputs.release_tag }}
          generate_release_notes: true
          prerelease: false
          fail_on_unmatched_files: false

      - name: Upload release assets
        run: |
          RELEASE_TAG="${{ steps.meta.outputs.release_tag }}"
          for file in release-assets/* SHA256SUMS.txt; do
            for attempt in 1 2 3; do
              if gh release upload "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" "$file" --clobber; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Failed to upload $file" >&2
                exit 1
              fi
              sleep 10
            done
          done
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}

  gitlab-sync:
    name: Sync release to GitLab
    runs-on: ubuntu-latest
    needs: [release]
    if: always() && needs.release.result == 'success'
    steps:
      - name: Trigger GitLab release-sync pipeline
        run: |
          curl -fsS --request POST \
            --form "token=${{ secrets.GITLAB_TRIGGER_TOKEN }}" \
            --form "ref=main" \
            --form "variables[RELEASE_TAG]=${{ needs.release.outputs.release_tag }}" \
            "https://gitlab.com/api/v4/projects/${{ secrets.GITLAB_PROJECT_ID }}/trigger/pipeline"
